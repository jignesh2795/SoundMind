[project]
name = "soundmind"
version = "0.1.0"
description = "Local-first personal music intelligence system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "mutagen>=1.47,<2",
    "librosa>=0.11,<1",
    "soundfile>=0.13,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.18,<2"]
text-ml = ["fastembed>=0.8,<0.9"]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[project.scripts]
soundmind = "soundmind.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
